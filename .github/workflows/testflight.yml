name: TestFlight Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump_build:
        description: 'Automatically increment build number'
        required: false
        default: true
        type: boolean

concurrency:
  group: testflight-production
  cancel-in-progress: false

jobs:
  release:
    name: Build & Deploy to TestFlight
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Run Unit Tests
        run: swift tools/run_tests.swift

      - name: Install Apple Distribution Certificate
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: "ci-temporary-keychain-pass"
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERT_PATH
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "✓ Apple Distribution Certificate installed into runner keychain"

      - name: Configure App Store Connect API Key
        if: ${{ secrets.APP_STORE_CONNECT_KEY_ID != '' }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          echo "✓ App Store Connect API Key installed"

      - name: Build and Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          CERT_PRESENT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          # Calculate unique incrementing build number using GitHub run number
          BUILD_NUM=$(( ${{ github.run_number }} + 10 ))
          echo "Target Build Number: $BUILD_NUM"
          
          if [ -n "$KEY_ID" ] && [ -n "$CERT_PRESENT" ]; then
            python3 tools/release.py --upload --build-number "$BUILD_NUM" --api-key "$KEY_ID" --api-issuer "$KEY_ISSUER" --team-id 6522A974B3
          else
            echo "::warning ::Missing repository secrets (BUILD_CERTIFICATE_BASE64 and/or APP_STORE_CONNECT_KEY_ID). Running dry-run verification..."
            python3 tools/release.py --dry-run --build-number "$BUILD_NUM"
          fi

      - name: Clean Up Keychain & Keys
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain $KEYCHAIN_PATH || true
          fi
          rm -rf ~/.appstoreconnect/private_keys || true
