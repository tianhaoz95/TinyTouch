name: TestFlight Release

on:
  workflow_dispatch:
    inputs:
      bump_build:
        description: 'Automatically increment build number'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    name: Build & Upload to TestFlight
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 15.4+
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Run Unit Tests
        run: swift tools/run_tests.swift

      - name: Setup App Store Connect API Key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$KEY_P8" ]; then
            mkdir -p ~/.appstoreconnect/private_keys
            echo "$KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
            echo "API Key configured for $KEY_ID"
          else
            echo "Notice: App Store Connect API Key secret not set in GitHub repository."
          fi

      - name: Build and Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          BUMP_FLAG=""
          if [ "${{ github.event.inputs.bump_build }}" = "true" ]; then
            BUMP_FLAG="--bump"
          fi
          
          if [ -n "$KEY_ID" ]; then
            python3 tools/release.py --upload $BUMP_FLAG --api-key "$KEY_ID" --api-issuer "$KEY_ISSUER"
          else
            echo "Running archive verification (dry run) because API key is not configured in CI secrets..."
            python3 tools/release.py --dry-run $BUMP_FLAG
          fi
